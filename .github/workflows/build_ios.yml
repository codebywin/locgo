name: Build iOS .deb Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_deb:
    name: Build .deb for iOS (ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Compile and Package .deb
        run: |
          set -e
          echo "=== 1. Checking iOS SDK ==="
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK Path: $SDK_PATH"

          echo "=== 2. Compiling ARM64 binary ==="
          xcrun -sdk iphoneos clang -arch arm64 \
              -miphoneos-version-min=14.0 \
              -fobjc-arc \
              -isysroot "$SDK_PATH" \
              -Wno-deprecated-declarations \
              -Wno-nullability-completeness \
              -framework UIKit \
              -framework AVFoundation \
              -framework CoreGraphics \
              -framework CoreImage \
              -framework QuartzCore \
              -framework CoreMedia \
              -framework CoreVideo \
              -lz \
              src/*.m \
              -o ACBFace

          echo "=== 3. Code signing ==="
          codesign -s - --entitlements entitlements.plist -f ACBFace || true

          echo "=== 4. Creating package layout ==="
          rm -rf deb_root packages
          mkdir -p deb_root/Applications/ACBFace.app
          mkdir -p deb_root/DEBIAN
          mkdir -p packages

          mv ACBFace deb_root/Applications/ACBFace.app/
          cp Info.plist deb_root/Applications/ACBFace.app/
          cp control deb_root/DEBIAN/control
          if [ -f layout/DEBIAN/postinst ]; then
              cp layout/DEBIAN/postinst deb_root/DEBIAN/postinst
              chmod 755 deb_root/DEBIAN/postinst
          fi

          echo "=== 5. Building .deb ==="
          dpkg-deb -Zgzip -b deb_root packages/ACBFace_1.0.0_iphoneos-arm64.deb

          echo "=== 6. Build completed ==="
          ls -lh packages/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACBFace_1.0.0_iphoneos-arm64
          path: packages/*.deb
