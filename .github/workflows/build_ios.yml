name: Build iOS .deb Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_deb:
    name: Build .deb for iOS (ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Compile and Package .deb
        run: |
          chmod +x build_deb.sh
          bash build_deb.sh

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACBFace_1.0.0_iphoneos-arm64
          path: packages/*.deb
